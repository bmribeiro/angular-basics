<div class="task-container">
  <h2>Tasks - (Total: {{ totalTasks() }})</h2>

  <form [formGroup]="newTaskForm" (ngSubmit)="onSubmit()">

    <label for="title">New task:</label>
    <input formControlName="title" placeholder="Enter a task...">

    <label for="priority">Priority:</label>
    <select formControlName="priority">
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>
    <button type="submit" [disabled]="newTaskForm.invalid">Add</button>
    <button type="button" (click)="clearAll()">Clear Storage</button>
  </form>

  <!-- The presentation logic (Control Flow) remains unchanged -->
  @if (totalTasks() === 0) {
    <p>No pending tasks!</p>
  } @else {
    <ul>
      @for (task of tasks(); track $index) {

        <app-task-item 
          [task]="task" 
          (remove)="removeTask($index)">
        </app-task-item>
        
      }
    </ul>
  }
</div>
