<div class="app-layout">

  <!-- Navigation Header -->
  <nav class="main-menu">
    <h1>Angular Basics</h1>
    <ul>
      <li>
        <!-- routerLink replaces the traditional "href". routerLinkActive applies the "active" CSS class when the URL matches. -->
        <a routerLink="/home" routerLinkActive="active">My Profile</a>
      </li>
      <li>
        <a routerLink="/tasks" routerLinkActive="active">Tasks - Memory</a>
      </li>
      <li>
        <a routerLink="/tasks-persistent" routerLinkActive="active">Tasks - Persistent</a>
      </li>
      <li>
        <a routerLink="/task-api" routerLinkActive="active">Tasks - API REST</a>
      </li>
    </ul>

    <div class="auth-status">
      @if (authService.isAuthenticated()) {
      <span>Authenticated</span>
      <button type="button" (click)="authService.logout()">Logout</button>
      } @else {
      <span>Visitante</span>
      <button type="button" (click)="authService.login()">Login</button>
      }
    </div>
  </nav>

  <!-- Dynamic Content Container -->
  <main class="content">
    <!-- Angular injects the HTML of the component associated with the active route here. -->
    <router-outlet></router-outlet>
  </main>
</div>
