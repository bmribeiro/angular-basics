<div class="app-layout">

  <!-- Navigation Header -->
  <nav class="main-menu">
    <h1>Angular Basics</h1>
    <ul>
      <li>
        <!-- routerLink replaces the traditional "href". routerLinkActive applies the "active" CSS class when the URL matches. -->
        <a routerLink="/home" routerLinkActive="active">My Profile</a>
      </li>
      <li>
        <a routerLink="/tarefas" routerLinkActive="active">Task Management</a>
      </li>
    </ul>
  </nav>

  <!-- Dynamic Content Container -->
  <main class="content">
    <!-- Angular injects the HTML of the component associated with the active route here. -->
    <router-outlet></router-outlet>
  </main>
</div>
